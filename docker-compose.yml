# 本文件只使用现成镜像，不在 Compose 里构建。
#
# 推荐：推送到 GitHub 后由 Actions 构建并推到 GHCR，NAS 上已有的 Watchtower
# 收到 webhook 后自动拉取并重建容器。一次性配置见 docs/DEPLOY.md。
#
# 注意：这里【不包含】Watchtower 服务。NAS 上 opds-library 那套 Compose 里已经跑着
# Watchtower（127.0.0.1:8081，WATCHTOWER_LABEL_ENABLE=true），它会更新本机所有带
# com.centurylinklabs.watchtower.enable=true 标签的容器。再起一个会冲突。
#
# 也可以在本地构建后覆盖镜像名：
#   docker build -t family-meal-api:local .
#   在 .env 里设 API_IMAGE=family-meal-api:local
#
# 然后 cp .env.example .env，改好密码和 JWT_SECRET，执行：
#   docker compose up -d
services:
  api:
    image: ${API_IMAGE:-ghcr.io/zzwen6/family-meal-api:latest}
    ports:
      - "${HTTP_PORT:-8090}:8080"
    environment:
      TZ: ${APP_TIMEZONE:-Asia/Shanghai}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-family_meal}?useUnicode=true&characterEncoding=utf8&serverTimezone=${APP_TIMEZONE:-Asia/Shanghai}&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-family_meal}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置至少 32 字节的 JWT_SECRET}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-720}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_FAMILY_NAME: ${ADMIN_FAMILY_NAME:-我的家}
      WECHAT_APPID: ${WECHAT_APPID:-}
      WECHAT_SECRET: ${WECHAT_SECRET:-}
      WECHAT_MOCK_ENABLED: ${WECHAT_MOCK_ENABLED:-false}
      WECHAT_DINNER_READY_TEMPLATE_ID: ${WECHAT_DINNER_READY_TEMPLATE_ID:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError}
    labels:
      - com.centurylinklabs.watchtower.enable=true
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    environment:
      TZ: ${APP_TIMEZONE:-Asia/Shanghai}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-family_meal}
      MYSQL_USER: ${MYSQL_USER:-family_meal}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
    volumes:
      - ${MYSQL_DATA_HOST_PATH:-./mysql-data}:/var/lib/mysql
    # 默认只在 Compose 内部网络可见；需要从宿主机连库调试时取消注释
    # ports:
    #   - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # 数据库不跟随 Watchtower 自动升级
    labels:
      - com.centurylinklabs.watchtower.enable=false
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "exec redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - ${REDIS_DATA_HOST_PATH:-./redis-data}:/data
    labels:
      - com.centurylinklabs.watchtower.enable=false
    restart: unless-stopped
