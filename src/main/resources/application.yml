server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: family-meal-api
  servlet:
    multipart:
      max-file-size: ${MEDIA_MAX_FILE:30MB}
      max-request-size: ${MEDIA_MAX_REQUEST:32MB}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/family_meal?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:family_meal}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: ${APP_TIMEZONE:Asia/Shanghai}
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 2s
  jackson:
    time-zone: ${APP_TIMEZONE:Asia/Shanghai}
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: ${HEALTH_CHECK_REDIS:true}

app:
  timezone: ${APP_TIMEZONE:Asia/Shanghai}
  jwt:
    # 至少 32 字节；留空会生成临时密钥（重启后需重新登录）
    secret: ${JWT_SECRET:}
    ttl-hours: ${JWT_TTL_HOURS:720}
    issuer: family-meal
  wechat:
    appid: ${WECHAT_APPID:}
    secret: ${WECHAT_SECRET:}
    # 未配置 appid 时，允许 wx-login 用 mock openid（仅开发调试，生产请关闭）
    mock-enabled: ${WECHAT_MOCK_ENABLED:false}
    # 开饭提醒订阅消息模板 ID；和 appid/secret 都配了才真正推送，否则只写站内通知（SKIPPED）
    dinner-ready-template-id: ${WECHAT_DINNER_READY_TEMPLATE_ID:}
    api-base: ${WECHAT_API_BASE:https://api.weixin.qq.com}
    subscribe:
      # 模板字段名因你在微信后台选的模板而异，按模板详情里的「thing1 / time3」等填写；留空表示不发该字段
      title-field: ${WECHAT_TPL_TITLE_FIELD:thing1}
      content-field: ${WECHAT_TPL_CONTENT_FIELD:thing2}
      time-field: ${WECHAT_TPL_TIME_FIELD:time3}
      # 点消息跳转的小程序版本：formal / trial / developer
      miniprogram-state: ${WECHAT_MINIPROGRAM_STATE:formal}
      lang: zh_CN
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
    family-name: ${ADMIN_FAMILY_NAME:我的家}
  cors:
    # 逗号分隔，支持通配，如 https://meal.example.com,http://localhost:5173
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
  login:
    max-failures: ${LOGIN_MAX_FAILURES:5}
    lock-minutes: ${LOGIN_LOCK_MINUTES:10}
  media:
    # 本地媒体目录，compose 可挂到 NAS 目录；文件名是不可猜测的 UUID
    path: ${MEDIA_PATH:./data/media}
    image-max-bytes: ${MEDIA_IMAGE_MAX_BYTES:5242880}
    video-max-bytes: ${MEDIA_VIDEO_MAX_BYTES:31457280}
  jobs:
    deadline-cron: ${DEADLINE_CRON:0 * * * * *}

logging:
  level:
    com.zzwen6.familymeal: INFO
